<svg xmlns="http://www.w3.org/2000/svg" width="860" height="56" viewBox="0 0 860 56" role="img" aria-label="Section: open-source" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:18px;font-weight:700}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(860px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.sw{animation:sweep 3.6s ease-in-out infinite}
.c{animation:blink 1s steps(1) infinite}
.t{animation:rise .7s ease-out both}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1F6FEB"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="ln"><rect x="0" y="46" width="860" height="3" rx="1.5"/></clipPath></defs>
<g class="t"><text x="6" y="30" fill="#3FB950">❯</text><text x="30" y="30" fill="#58A6FF">~/open-source</text><rect class="c" x="174.4" y="13" width="10" height="21" fill="#3FB950"/>
<text x="854" y="30" text-anchor="end" fill="#30363D" font-size="14">05/08</text></g>
<rect x="0" y="46" width="860" height="3" rx="1.5" fill="#21262D"/>
<g clip-path="url(#ln)"><rect x="0" y="46" width="205" height="3" fill="url(#g)"/><rect class="sw" x="0" y="46" width="300" height="3" fill="url(#s)"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>