name: Update trophies
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate trophies.svg
        env:
          GITHUB_TOKEN: ${{ secrets.TROPHY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python gen_trophies.py codeMaestro78 trophies.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          git diff --staged --quiet || (git commit -m "chore: refresh trophies" && git push)
